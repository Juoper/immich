name: Custom release image

# Rebuilds the server image whenever Immich publishes a new release:
# takes the release tag, replays the commits of FEATURE_BRANCH on top of it
# and publishes the result to ghcr.io. With a DEPLOY_PUSH_TOKEN secret
# (classic PAT with `repo` and `workflow` scopes) the rebased code is also
# pushed to DEPLOY_BRANCH.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Immich release tag to build (empty = latest release)
        required: false
        default: ''
      force:
        description: Rebuild even if the image for this release already exists
        type: boolean
        default: false

concurrency:
  group: custom-release-image
  cancel-in-progress: false

permissions: {}

env:
  UPSTREAM: immich-app/immich
  FEATURE_BRANCH: feat/search-filter-owner
  DEPLOY_BRANCH: custom/release
  TAG_SUFFIX: owner-filter
  PLATFORMS: linux/amd64
  GENERATED_FILES: open-api/immich-openapi-specs.json packages/sdk/src/fetch-client.ts

jobs:
  check:
    name: Check for a new release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      image: ${{ steps.release.outputs.image }}
      build: ${{ steps.image.outputs.build }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          release="${INPUT_TAG:-$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)}"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER,,}/immich-server" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: image
        env:
          FORCE: ${{ inputs.force }}
          IMAGE: ${{ steps.release.outputs.image }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          if [[ "$FORCE" != "true" ]] && docker manifest inspect "$IMAGE:$RELEASE-$TAG_SUFFIX" > /dev/null 2>&1; then
            echo "$IMAGE:$RELEASE-$TAG_SUFFIX already exists"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building $RELEASE"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  rebase:
    name: Rebase feature onto release
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          fetch-depth: 1
          persist-credentials: false

      - name: Replay feature commits on the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.check.outputs.release }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          mapfile -t commits < <(gh api "repos/$UPSTREAM/compare/main...$OWNER:$REPO_NAME:$FEATURE_BRANCH" --jq '.commits[].sha')
          if [[ ${#commits[@]} -eq 0 ]]; then
            echo "::error::$FEATURE_BRANCH has no commits on top of $UPSTREAM main"
            exit 1
          fi
          echo "Replaying ${#commits[@]} commit(s): ${commits[*]}"

          git fetch --depth "$(( ${#commits[@]} + 1 ))" origin "$FEATURE_BRANCH"
          git fetch --depth 1 "https://github.com/$UPSTREAM.git" "refs/tags/$RELEASE:refs/tags/$RELEASE"
          git checkout -B "$DEPLOY_BRANCH" "$RELEASE"

          for commit in "${commits[@]}"; do
            if git cherry-pick "$commit"; then
              continue
            fi

            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            for file in "${conflicts[@]}"; do
              if [[ " $GENERATED_FILES " != *" $file "* ]]; then
                echo "::error::Cherry-picking $commit onto $RELEASE conflicts in $file, rebase $FEATURE_BRANCH manually"
                git cherry-pick --abort
                exit 1
              fi
            done

            # generated files are regenerated below, so keep the release's version for now
            git checkout --ours -- "${conflicts[@]}"
            git add -- "${conflicts[@]}"
            git -c core.editor=true cherry-pick --continue
          done

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@caac7f7e4298458a14238959504f411fc6cc7f06 # use-mise-action-v3.2.3
        with:
          github_token: ${{ github.token }}

      - name: Regenerate API clients
        run: |
          pnpm --filter immich install --frozen-lockfile
          mise //:open-api
          git checkout -- mise.lock 2> /dev/null || true

          read -ra generated <<< "$GENERATED_FILES"
          if ! git diff --quiet -- "${generated[@]}"; then
            git add -- "${generated[@]}"
            git commit -m 'chore: regenerate open-api'
          fi

      - name: Bundle rebased commits
        env:
          RELEASE: ${{ needs.check.outputs.release }}
        run: git bundle create "$RUNNER_TEMP/deploy.bundle" "refs/tags/$RELEASE..refs/heads/$DEPLOY_BRANCH"

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: ${{ runner.temp }}/deploy.bundle
          retention-days: 7

      - name: Push deploy branch
        env:
          PUSH_TOKEN: ${{ secrets.DEPLOY_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [[ -z "$PUSH_TOKEN" ]]; then
            echo "::notice::DEPLOY_PUSH_TOKEN is not set, skipping the push of $DEPLOY_BRANCH"
            exit 0
          fi
          git push --force "https://x-access-token:$PUSH_TOKEN@github.com/$REPO.git" "HEAD:refs/heads/$DEPLOY_BRANCH"

  build:
    name: Build and push image
    needs: [check, rebase]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: ${{ runner.temp }}

      - id: source
        name: Restore rebased source
        env:
          RELEASE: ${{ needs.check.outputs.release }}
        run: |
          git init --quiet .
          git fetch --depth 1 "https://github.com/$UPSTREAM.git" "refs/tags/$RELEASE:refs/tags/$RELEASE"
          git fetch "$RUNNER_TEMP/deploy.bundle" "refs/heads/$DEPLOY_BRANCH"
          git checkout --quiet FETCH_HEAD
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git log --oneline -5

      - uses: docker/setup-qemu-action@v3
        if: contains(env.PLATFORMS, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            DEVICE=cpu
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ needs.check.outputs.release }}-${{ env.TAG_SUFFIX }}
            BUILD_SOURCE_REF=${{ env.DEPLOY_BRANCH }}
            BUILD_SOURCE_COMMIT=${{ steps.source.outputs.sha }}
          tags: |
            ${{ needs.check.outputs.image }}:${{ needs.check.outputs.release }}-${{ env.TAG_SUFFIX }}
            ${{ needs.check.outputs.image }}:release-${{ env.TAG_SUFFIX }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
